<!doctype html><html><head><meta charset="utf-8"><title>No-key map embed test</title>
<style>body{font-family:system-ui;margin:2rem}iframe{width:100%;height:380px;border:1px solid #ccc;display:block;margin-bottom:1.5rem}h3{font-size:.9rem;margin:.5rem 0}</style>
</head><body>
<h3>A. place_id via maps.google.com/maps?…&amp;output=embed</h3>
<iframe id="a" src="https://maps.google.com/maps?q=place_id:ChIJQcKz4FAZHxURb6fG5-otlRA&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
<h3>B. free-text query via the same route</h3>
<iframe id="b" src="https://maps.google.com/maps?q=Bob%20Music%20Old%20Saida%20Rd%20Lebanon&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  ['a','b'].forEach(function(id){
    var f=document.getElementById(id);
    f.addEventListener('load',function(){ f.dataset.loaded='1'; });
    f.addEventListener('error',function(){ f.dataset.loaded='err'; });
  });
</script>
</body></html>
