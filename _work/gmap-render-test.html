<!doctype html><html lang="en" class="js"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map card — render test</title>
<!--
  Proves snippets/google-map.liquid renders without any API key.

  WHAT WAS TESTED AND WHAT IT SHOWED
    q=place_id:ChIJ…&output=embed  -> a WORLD MAP. The legacy embed route does
                                      not resolve place_id. Do not "improve" the
                                      snippet by switching the query to it.
    q=<name and address>           -> resolves. Google draws the card itself:
                                      "Bob music · Old Saida Rd, Lebanon ·
                                      5.0 ★ (18)", Directions, Open in Maps.
    plus- vs percent-encoded spaces -> both resolve; Liquid's url_encode emits
                                      plus, which is fine.

  Confirmed independently with curl: the embed HTML contains "Bob music",
  "Old Saida Rd", the Knowledge Graph id /g/11hdpyb6r3 and the coordinates
  33.8053851, 35.4985436.

  If the tiles come back grey here, check the IP before the code — Google
  throttles repeated automated loads and serves the chrome without the tiles.
-->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Karla:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
</head><body>
<section class="section section--shell">
  <div class="wrap">
    <div class="section-head"><div>
      <p class="eyebrow">Bob Music Store — Beirut</p>
      <h2 class="h1">Find us</h2>
    </div></div>
    <div class="gmap">
      <div class="gmap__frame" style="--gmap-h:380px">
        <iframe src="https://maps.google.com/maps?q=Bob%20Music%20Old%20Saida%20Rd%20Lebanon&output=embed"
                title="Bob Music Store on Google Maps" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
      <div class="gmap__actions">
        <a class="btn btn--ghost btn--sm" href="https://www.google.com/maps/dir/?api=1&destination=Bob%20Music%20Old%20Saida%20Rd%20Lebanon&destination_place_id=ChIJQcKz4FAZHxURb6fG5-otlRA" target="_blank" rel="noopener">Directions →</a>
        <a class="gmap__link" href="https://www.google.com/maps/place/?q=place_id:ChIJQcKz4FAZHxURb6fG5-otlRA" target="_blank" rel="noopener">Reviews on Google</a>
        <a class="gmap__link" href="https://search.google.com/local/writereview?placeid=ChIJQcKz4FAZHxURb6fG5-otlRA" target="_blank" rel="noopener">Write a review</a>
      </div>
    </div>
  </div>
</section>
</body></html>
